databases:
  - name: habitflow-db
    plan: free
    databaseName: habitflow
    user: habitflow

services:
  - type: web
    name: habitflow-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: habitflow-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: https://trackyourhabitss.netlify.app,http://localhost:5173,http://localhost:5174
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"

